services:
  telemetry.rabbitmq:
    image: rabbitmq:3.13-management
    container_name: telemetry-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
  
  telemetry.producer:
    image: ${DOCKER_REGISTRY-}telemetryproducer
    build:
      context: .
      dockerfile: src/Telemetry.Producer/Dockerfile
    environment:
      RABBITMQ_HOST: telemetry.rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
    command: ["--rate", "200", "--devices", "50"]
    depends_on:
      telemetry.rabbitmq:
        condition: service_healthy

  telemetry.worker:
    image: ${DOCKER_REGISTRY-}telemetryworker
    build:
      context: .
      dockerfile: src/Telemetry.Worker/Dockerfile
    environment:
      RabbitMq__Host: telemetry.rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASS:-guest}
      RabbitMq__PrefetchCount: "100"
    ports:
      - "8080:8080"
    depends_on:
      telemetry.rabbitmq:
        condition: service_healthy

